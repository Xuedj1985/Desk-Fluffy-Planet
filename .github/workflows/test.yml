name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 (Windows / Node 20)
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      # 测试只跑纯逻辑，不需要下载 Electron 二进制
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 运行单元测试
        run: npm test
